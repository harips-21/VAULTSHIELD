version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: securedoc-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: securedocdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d securedocdb']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: securedoc-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Express.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: securedoc-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/securedocdb?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-access-key-production-2026
      JWT_REFRESH_SECRET: super-secret-jwt-refresh-key-production-2026
      MASTER_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STORAGE_DIR: ./storage/encrypted
      CLIENT_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - encrypted_storage:/app/storage/encrypted

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: securedoc-frontend
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  encrypted_storage:
