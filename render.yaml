services:
  - type: web
    name: vaultshield-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/docker/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: vaultshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vaultshield-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: vaultshield-frontend
          property: host
      - key: STORAGE_DIR
        value: /tmp/vaultshield-encrypted
      - key: MAX_FILE_SIZE_MB
        value: "50"

  - type: web
    name: vaultshield-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    rootDir: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vaultshield-api
          property: host

  - type: keyvalue
    name: vaultshield-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

databases:
  - name: vaultshield-db
    plan: free
    region: oregon
    databaseName: vaultshield
    user: vaultshield
